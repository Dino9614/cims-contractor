
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - PERSADA APPS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h2 {
      color: #123b63;
      text-align: center;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 12px;
      border-radius: 7px;
    }

    input {
      border: 1px solid #cbd5e1;
    }

    button {
      background: #123b63;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>PERSADA APPS</h2>
    <h3>Buat Password Baru</h3>

    <form id="reset-form">
      <input
        id="new-password"
        type="password"
        placeholder="Password baru"
        minlength="8"
        required
      >

      <input
        id="confirm-password"
        type="password"
        placeholder="Konfirmasi password"
        minlength="8"
        required
      >

      <button id="reset-button" type="submit">
        Simpan Password Baru
      </button>
    </form>

    <p id="message" role="status"></p>
  </div>

  <script>
    const SUPABASE_URL =
      "https://savwfujstejgygbkngxr.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_Ctpwsis9YW9pn0CudzoLyA_eXxlJIIn";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const form = document.getElementById("reset-form");
    const message = document.getElementById("message");
    const button = document.getElementById("reset-button");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const password =
        document.getElementById("new-password").value;

      const confirmation =
        document.getElementById("confirm-password").value;

      if (password.length < 8) {
        message.textContent = "Password minimal 8 karakter.";
        message.style.color = "#b91c1c";
        return;
      }

      if (password !== confirmation) {
        message.textContent = "Konfirmasi password tidak cocok.";
        message.style.color = "#b91c1c";
        return;
      }

      button.disabled = true;
      button.textContent = "Menyimpan...";

      try {
        const { error } =
          await supabaseClient.auth.updateUser({
            password: password
          });

        if (error) throw error;

        message.style.color = "#15803d";
        message.textContent =
          "Password berhasil diperbarui. Silakan login kembali.";

        await supabaseClient.auth.signOut();

        form.reset();

        setTimeout(() => {
          window.location.href =
            "https://dino9614.github.io/cims-contractor/";
        }, 2500);

      } catch (error) {
        message.style.color = "#b91c1c";
        message.textContent =
          "Gagal memperbarui password: " + error.message;

      } finally {
        button.disabled = false;
        button.textContent = "Simpan Password Baru";
      }
    });
  </script>
</body>
</html>
