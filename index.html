<script>
  async function showPage(page, button) {
    document.querySelectorAll("nav button").forEach(function(item) {

    const content = document.getElementById("content");

   
if (page === "Dashboard") {
  content.innerHTML = `

    <p>Ringkasan kegiatan perusahaan kontraktor.</p>

    <div class="cards">

      </div>

      </div>

        </thead>

            <td colspan="4">Memuat data proyek...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p id="dashboard-message"></p>
  `;

  const { data: projects, error } = await supabaseClient
    .from("projects")
    .select("project_name, contract_value, status, progress")
    .eq("approval_status", "approved")
    .order("created_at", { ascending: false });

  if (error) {
    document.getElementById("dashboard-message").textContent =
      "Gagal memuat data: " + error.message;
    return;
  }

  const active = projects.filter(p => p.status === "Berjalan").length;
  const finished = projects.filter(p => p.status === "Selesai").length;

  const contractTotal = projects.reduce(
    (sum, p) => sum + Number(p.contract_value || 0),
    0
  );

  const rupiah = value =>
    new Intl.NumberFormat("id-ID", {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }).format(value);

  const safe = value => String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]
  );

  document.getElementById("dash-active").textContent = active;
  document.getElementById("dash-contract").textContent =
    rupiah(contractTotal);
  document.getElementById("dash-finished").textContent = finished;
  document.getElementById("dash-total").textContent = projects.length;

  const projectList =
    document.getElementById("dashboard-project-list");

  if (projects.length === 0) {
    projectList.innerHTML = `
      <tr>
        <td colspan="4">Belum ada data proyek.</td>
      </tr>
    `;
  } else {
    projectList.innerHTML = projects.map(p => `
      <tr>
        <td>${safe(p.project_name)}</td>
        <td>${rupiah(Number(p.contract_value || 0))}</td>
        <td>${safe(p.status)}</td>
        <td>${Number(p.progress || 0)}%</td>
      </tr>
    `).join("");
  }



} else if (page === "Pengajuan Proyek") {

>

</select>

                "

  const projectForm = document.getElementById("project-form");
  const projectMessage = document.getElementById("project-message");
  const contractInput = document.getElementById("contract-value");
  const saveButton = document.getElementById("save-project-button");
  // MEMUAT DATA MASTER KLIEN
  const clientSelect = document.getElementById("client-name");

  async function loadProjectClients() {
  clientSelect.innerHTML =
    '<option value="">Memuat data Pemilik Proyek - Area...</option>';

  const { data: clients, error: clientError } = await supabaseClient
    .from("clients")
    .select("id, company_name")
    .eq("is_active", true);

  const { data: areas, error: areaError } = await supabaseClient
    .from("areas")
    .select("id, area_code, area_name");

  const { data: relations, error: relationError } = await supabaseClient
    .from("client_areas")
    .select("client_id, area_id");

  if (clientError || areaError || relationError) {
    clientSelect.innerHTML =
      '<option value="">Gagal memuat data</option>';

    projectMessage.style.color = "#dc2626";
    projectMessage.textContent =
      "Gagal mengambil data: " +
      (clientError?.message ||
       areaError?.message ||
       relationError?.message);

    return;
  }

  clientSelect.innerHTML = "";
  clientSelect.add(new Option("Pilih Pemilik Proyek - Area", ""));

  clients.forEach(client => {
    const linkedAreas = relations.filter(
      relation => relation.client_id === client.id
    );

    linkedAreas.forEach(relation => {
      const area = areas.find(
        item => item.id === relation.area_id
      );

      if (area) {
        const label =
          client.company_name +
          " - " +
          area.area_code +
          " (" +
          area.area_name +
          ")";

        clientSelect.add(
          new Option(
            label,
            client.id + "|" + area.id
          )
        );
      }
    });
  });
}

loadProjectClients();
  // FORMAT RUPIAH OTOMATIS
  contractInput.addEventListener("input", function() {

    this.value = angka === ""
      ? ""
      : new Intl.NumberFormat("id-ID", {
          maximumFractionDigits: 0
        }).format(Number(angka));
  });

  // SIMPAN PENGAJUAN PROYEK
  projectForm.addEventListener("submit", async function(e) {
    e.preventDefault();

    const projectName =
      document.getElementById("project-name").value.trim();

    const selectedClientArea = clientSelect.value;

const [clientId, areaId] = selectedClientArea
  ? selectedClientArea.split("|")
  : ["", ""];

const clientName =
  clientSelect.options[clientSelect.selectedIndex]?.text || "";

if (!clientId) {
  projectMessage.style.color = "#dc2626";
  projectMessage.textContent =
    "Pilih klien / pemilik proyek dari Master Klien.";
  return;
}
    const contractReference =
      document.getElementById("contract-reference").value.trim();

      Number(contractInput.value.replace(/\D/g, ""));

    const startDate =
      document.getElementById("start-date").value;

    const endDate =
      document.getElementById("end-date").value;

    if (!Number.isSafeInteger(contractValue) || contractValue <= 0) {
      projectMessage.style.color = "#dc2626";
      projectMessage.textContent = "Masukkan nilai kontrak yang valid.";
      return;
    }

    if (new Date(endDate) < new Date(startDate)) {
      projectMessage.style.color = "#dc2626";
      projectMessage.textContent =
        "Tanggal penyelesaian tidak boleh lebih awal dari tanggal mulai.";
      return;
    }

    projectMessage.style.color = "#64748b";
    projectMessage.textContent = "Sedang menyimpan pengajuan proyek...";

    saveButton.disabled = true;
    saveButton.textContent = "Menyimpan...";

    try {

      const { data: userData, error: userError } =

async function loadUsers() {

    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]
  );

const userTable = document.getElementById("user-table");

userTable.addEventListener("click", async function(event) {
  const button = event.target.closest("button[data-action]");
  if (!button) return;

  const id = button.dataset.id;
  const action = button.dataset.action;

  if (action === "edit") {
    const name = prompt("Nama lengkap:", button.dataset.name);
    if (name === null) return;

    const role = prompt(
      "Masukkan role:\ndirector, project_manager, estimator, purchasing, warehouse, finance, accounting, viewer",
      button.dataset.role
    );

    if (role === null) return;

    const allowedRoles = [
      "director",
      "project_manager",
      "estimator",
      "purchasing",
      "warehouse",
      "finance",
      "accounting",
      "viewer"
    ];

    if (!name.trim()) {
      alert("Nama tidak boleh kosong.");
      return;
    }

    if (!allowedRoles.includes(role.trim())) {
      alert("Role tidak valid.");
      return;
    }

    const { error } = await supabaseClient
      .from("profiles")
      .update({
        full_name: name.trim(),
        role: role.trim()
      })
      .eq("id", id);

    if (error) {
      alert("Gagal mengedit: " + error.message);
      return;
    }

    alert("Data pengguna berhasil diperbarui.");
    await loadUsers();
  }

  if (action === "toggle") {
    const currentlyActive = button.dataset.active === "true";
    const newStatus = !currentlyActive;

    if (!confirm(
      newStatus
        ? "Aktifkan kembali pengguna ini?"
        : "Nonaktifkan pengguna ini?"
    )) return;

    const { error } = await supabaseClient
      .from("profiles")
      .update({ is_active: newStatus })
      .eq("id", id);

    if (error) {
      alert("Gagal mengubah status: " + error.message);
      return;
    }

    alert("Status pengguna berhasil diperbarui.");
    await loadUsers();
  }
});
