<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CIMS Contractor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      background: #12345a;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin-bottom: 0;
      color: #dbeafe;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    nav {
      width: 230px;
      background: #172b4d;
      padding: 20px 12px;
      flex-shrink: 0;
    }

    nav button {
      display: block;
      width: 100%;
      padding: 13px;
      margin-bottom: 6px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: white;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }

    nav button:hover,
    nav button.active {
      background: #2563eb;
    }

    main {
      flex: 1;
      min-width: 0;
      padding: 24px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0000000d;
    }

    .card p {
      color: #64748b;
      font-size: 13px;
    }

    .card h2 {
      font-size: 23px;
      margin-bottom: 0;
    }

    .panel {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 500px;
    }

    th, td {
      padding: 13px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
    }

    th {
      background: #f8fafc;
    }

    .badge {
      background: #fef3c7;
      color: #92400e;
      padding: 5px 9px;
      border-radius: 15px;
      font-size: 12px;
    }

    #content {
      min-height: 200px;
    }

    .notice {
      background: #dbeafe;
      padding: 14px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .container {
        display: block;
      }

      nav {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 5px;
      }

      nav button {
        margin: 0;
        font-size: 12px;
      }

      main {
        padding: 14px;
      }

      .cards {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .card {
        padding: 13px;
      }

      .card h2 {
        font-size: 18px;
      }
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://savwfujstejgygbkngxr.supabase.co/rest/v1/";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Ctpwsis9YW9pn0CudzoLyA_eXxlJIIn";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
</script>
</head>

<body>

<header>
  <h1>CIMS CONTRACTOR</h1>
  <p>Contractor Integrated Management System</p>
</header>

<div class="container">

  <nav>
    <button class="active" onclick="showPage('Dashboard', this)">
      🏠 Dashboard
    </button>

    <button onclick="showPage('Master Data', this)">
      📁 Master Data
    </button>

    <button onclick="showPage('Proyek', this)">
      🏗️ Data Proyek
    </button>

    <button onclick="showPage('RAB', this)">
      📋 RAB
    </button>

    <button onclick="showPage('Penawaran', this)">
      📄 Penawaran
    </button>

    <button onclick="showPage('Purchase Order', this)">
      🛒 Purchase Order
    </button>

    <button onclick="showPage('Delivery Order', this)">
      🚚 Delivery Order
    </button>

    <button onclick="showPage('Akuntansi', this)">
      💰 Akuntansi
    </button>

    <button onclick="showPage('Approval', this)">
      ✅ Approval
    </button>

    <button onclick="showPage('Laporan Proyek', this)">
      📊 Laporan Proyek
    </button>

    <button onclick="showPage('Pengguna', this)">
      👥 Pengguna
    </button>
  </nav>

  <main>
    <div id="content"></div>
  </main>

</div>

<script>
  function showPage(page, button) {
    document.querySelectorAll("nav button").forEach(function(item) {
      item.classList.remove("active");
    });

    if (button) {
      button.classList.add("active");
    }

    const content = document.getElementById("content");

    if (page === "Dashboard") {
      content.innerHTML = `
        <h2>Dashboard</h2>
        <p>Ringkasan kegiatan perusahaan kontraktor.</p>

        <div class="cards">
          <div class="card">
            <p>Proyek Aktif</p>
            <h2>0</h2>
          </div>

          <div class="card">
            <p>Total Penawaran</p>
            <h2>Rp 0</h2>
          </div>

          <div class="card">
            <p>Total Purchase Order</p>
            <h2>Rp 0</h2>
          </div>

          <div class="card">
            <p>Menunggu Approval</p>
            <h2>0</h2>
          </div>
        </div>

        <div class="panel">
          <h3>Daftar Proyek</h3>

          <table>
            <thead>
              <tr>
                <th>Nama Proyek</th>
                <th>Nilai Kontrak</th>
                <th>Status</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td colspan="3">
                  Belum ada data proyek.
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="notice">
          Mode prototipe. Data belum terhubung ke database.
        </div>
      `;
    } else {
      content.innerHTML = `
        <h2>${page}</h2>

        <div class="panel">
          <h3>Modul ${page}</h3>
          <p>
            Modul ini belum diaktifkan.
            Kita akan membangunnya secara bertahap.
          </p>
          <span class="badge">Dalam pengembangan</span>
        </div>
      `;
    }
  }

  showPage("Dashboard");
</script>

</body>
</html>
