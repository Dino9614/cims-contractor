  async function loadProjectClients() {
  clientSelect.innerHTML =
    '<option value="">Memuat data Pemilik Proyek - Area...</option>';

  const { data: clients, error: clientError } = await supabaseClient
    .from("clients")
    .select("id, company_name")
    .eq("is_active", true);

  const { data: areas, error: areaError } = await supabaseClient
    .from("areas")
    .select("id, area_code, area_name");

  const { data: relations, error: relationError } = await supabaseClient
    .from("client_areas")
    .select("client_id, area_id");

  if (clientError || areaError || relationError) {
    clientSelect.innerHTML =
      '<option value="">Gagal memuat data</option>';

    projectMessage.style.color = "#dc2626";
    projectMessage.textContent =
      "Gagal mengambil data: " +
      (clientError?.message ||
       areaError?.message ||
       relationError?.message);

    return;
  }

  clientSelect.innerHTML = "";
  clientSelect.add(new Option("Pilih Pemilik Proyek - Area", ""));

 clients.forEach(client => {
  const linkedAreas = relations.filter(
    relation => relation.client_id === client.id
  );

  // Jika perusahaan belum memiliki area
  if (linkedAreas.length === 0) {
    clientSelect.add(
      new Option(
        client.company_name,
        client.id + "|"
      )
    );

    return;
  }

  // Jika perusahaan memiliki area
  linkedAreas.forEach(relation => {
    const area = areas.find(
      item => item.id === relation.area_id
    );

    if (area) {
      const label =
        client.company_name +
        " - " +
        area.area_code +
        " (" +
        area.area_name +
        ")";

      clientSelect.add(
        new Option(
          label,
          client.id + "|" + area.id
        )
      );
    }
  });
});

              <th>Nama Proyek</th>
              <th>Pemilik Proyek</th>
              <th>Nilai Kontrak</th>
              <th>Status Approval</th>
              <th>Catatan Keputusan</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="approval-project-list"></tbody>
        </table>
      </div>
    </div>
  `;

  const approvalMessage = document.getElementById("approval-message");
  const projectList = document.getElementById("approval-project-list");

  const safe = value => String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]
  );

  const rupiah = value =>
    new Intl.NumberFormat("id-ID", {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }).format(Number(value || 0));

  const statusLabels = {
    draft: "Draft",
    pending_pm: "Menunggu Persetujuan PM",
    pending_director: "Menunggu Persetujuan Direktur",
    approved: "Disetujui",
    revision: "Perlu Revisi",
    rejected: "Ditolak"
  };

  async function loadApprovalProjects() {

    approvalMessage.textContent = "Memuat data pengajuan...";

    const { data: userData, error: userError } =
      await supabaseClient.auth.getUser();

    if (userError) throw userError;

    if (!userData.user) {
      throw new Error("Sesi login tidak ditemukan. Silakan login kembali.");
    }

    const { data: profile, error: profileError } =
      await supabaseClient
        .from("profiles")
        .select("role, is_active")
        .eq("id", userData.user.id)
        .single();

    if (profileError) throw profileError;

    if (!profile || !profile.is_active) {
      throw new Error("Akun tidak aktif atau profil tidak ditemukan.");
    }

    const { data: projects, error } = await supabaseClient
      .from("projects")
      .select("id, project_name, client_name, contract_value, approval_status, revision_note")
      .order("created_at", { ascending: false });

    if (error) throw error;

    document.getElementById("approval-pm-count").textContent =
      projects.filter(p => p.approval_status === "pending_pm").length;

    document.getElementById("approval-director-count").textContent =
      projects.filter(p => p.approval_status === "pending_director").length;

    document.getElementById("approval-revision-count").textContent =
      projects.filter(p => p.approval_status === "revision").length;

    document.getElementById("approval-rejected-count").textContent =
      projects.filter(p => p.approval_status === "rejected").length;

    if (projects.length === 0) {
      projectList.innerHTML =
        `<tr><td colspan="6">Belum ada pengajuan proyek.</td></tr>`;
    } else {

      projectList.innerHTML = projects.map(p => {

        let canDecide = false;

        if (
          profile.role === "project_manager" &&
          p.approval_status === "pending_pm"
        ) {
          canDecide = true;
        }

        if (
          profile.role === "director" &&
          p.approval_status === "pending_director"
        ) {
          canDecide = true;
        }

        const actionButtons = canDecide ? `
          <textarea
            data-notes-for="${safe(p.id)}"
            placeholder="Catatan untuk revisi atau penolakan..."
            rows="2"
            style="width:190px;padding:8px;border:1px solid #cbd5e1;border-radius:6px;"
          ></textarea>

          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;">
            <button data-project-id="${safe(p.id)}"
              data-decision="approve"
              style="background:#15803d;color:white;padding:7px 10px;border:0;border-radius:5px;cursor:pointer;">
              Setujui
            </button>

            <button data-project-id="${safe(p.id)}"
              data-decision="revision"
              style="background:#d97706;color:white;padding:7px 10px;border:0;border-radius:5px;cursor:pointer;">
              Minta Revisi
            </button>

            <button data-project-id="${safe(p.id)}"
              data-decision="reject"
              style="background:#dc2626;color:white;padding:7px 10px;border:0;border-radius:5px;cursor:pointer;">
              Tolak
            </button>
          </div>
        ` : "-";

        return `
          <tr>
            <td>${safe(p.project_name)}</td>
            <td>${safe(p.client_name)}</td>
            <td>${rupiah(p.contract_value)}</td>
            <td>${statusLabels[p.approval_status] || safe(p.approval_status)}</td>
            <td>${safe(p.revision_note || "-")}</td>
            <td>${actionButtons}</td>
          </tr>
        `;
      }).join("");
    }

    approvalMessage.textContent =
      "Data pengajuan proyek berhasil dimuat.";
  }

  try {
    await loadApprovalProjects();
  } catch (error) {
    approvalMessage.textContent =
      "Gagal memuat data: " + error.message;
  }

  projectList.addEventListener("click", async function(event) {

    const button = event.target.closest("button[data-decision]");

    if (!button) return;

    const projectId = button.dataset.projectId;
    const decision = button.dataset.decision;

    const notesField = projectList.querySelector(
      `textarea[data-notes-for="${projectId}"]`
    );

    const notes = notesField ? notesField.value.trim() : "";

    if (
      (decision === "revision" || decision === "reject") &&
      !notes
    ) {
      alert("Catatan wajib diisi untuk revisi atau penolakan.");
      return;
    }

    const confirmation = {
      approve: "Apakah Anda yakin ingin menyetujui proyek ini?",
      revision: "Apakah Anda yakin ingin meminta revisi proyek ini?",
      reject: "Apakah Anda yakin ingin menolak proyek ini?"
    };

    if (!confirm(confirmation[decision])) return;

    const actionButtons = projectList.querySelectorAll(
      `button[data-project-id="${projectId}"]`
    );

    actionButtons.forEach(item => item.disabled = true);

    approvalMessage.textContent = "Memproses keputusan...";

    try {

      const { data: userData, error: userError } =
        await supabaseClient.auth.getUser();

      if (userError) throw userError;

      const { data: profile, error: profileError } =
        await supabaseClient
          .from("profiles")
          .select("role, is_active")
          .eq("id", userData.user.id)
          .single();

      if (profileError) throw profileError;

      if (!profile || !profile.is_active) {
        throw new Error("Akun tidak aktif.");
      }

      let functionName;

      if (
        profile.role === "project_manager" &&
        decision &&
        button.closest("tr").querySelector("td:nth-child(4)")
          .textContent.includes("PM")
      ) {
        functionName = "pm_decide_project";
      } else if (
        profile.role === "director" &&
        button.closest("tr").querySelector("td:nth-child(4)")
          .textContent.includes("Direktur")
      ) {
        functionName = "director_decide_project";
      } else {
        throw new Error("Role Anda tidak sesuai dengan tahap persetujuan proyek ini.");
      }

      const { error: decisionError } = await supabaseClient.rpc(
        functionName,
        {
          p_project_id: projectId,
          p_decision: decision,
          p_notes: notes || null
        }
      );

      if (decisionError) throw decisionError;

      approvalMessage.textContent =
        "Keputusan berhasil disimpan.";

      await loadApprovalProjects();

    } catch (error) {

      approvalMessage.textContent =
        "Gagal memproses keputusan: " + error.message;

      actionButtons.forEach(item => item.disabled = false);
    }
  });

} else {
  content.innerHTML = `
    <h2>${page}</h2>
    <div class="panel">
      <h3>Modul ${page}</h3>
      <p>
        Modul ini belum diaktifkan.
        Kita akan membangunnya secara bertahap.
      </p>
      <span class="badge">Dalam pengembangan</span>
    </div>
  `;
}
  }
</script>

}

      message.textContent = '';
      alert('Login berhasil. Selamat datang, ' + profile.full_name + '!');
    } catch (error) {
      message.textContent = error.message || 'Login gagal.';
    } finally {
      button.disabled = false;
      button.textContent = 'Masuk';
    }
  });
}

      await supabaseClient.auth.getSession();

    if (error) throw error;

    const session = data.session;

   // Belum ada session, tampilkan halaman login
if (!session) {
  document.body.classList.remove('session-checking');
  document.getElementById('session-loading').style.display = 'none';
  return;
}

    // Ambil profil pengguna
    const { data: profile, error: profileError } =
      await supabaseClient
        .from('profiles')
        .select('full_name, role, is_active')
        .eq('id', session.user.id)
        .single();

    if (profileError) throw profileError;

    // Periksa status akun
 if (!profile || !profile.is_active) {
  await supabaseClient.auth.signOut();
  document.body.classList.remove('session-checking');
  document.getElementById('session-loading').style.display = 'none';
  return;
}
    // Tampilkan aplikasi
   document.getElementById('login-screen').style.display = 'none';
   document.body.classList.add('authenticated');
   document.body.classList.remove('session-checking');
   document.getElementById('session-loading').style.display = 'none';
    showPage("Dashboard");

    const header = document.querySelector('header');

    if (header && !document.getElementById('login-welcome')) {

      header.appendChild(welcome);

    if (header && !document.getElementById('logout-button')) {

      logoutButton.addEventListener('click', async function () {

        const { error } = await supabaseClient.auth.signOut();

        if (error) {

    }

    console.log('PERSADA APPS: Session berhasil dipulihkan.');

 } catch (error) {
  console.error('Session recovery error:', error);
  document.body.classList.remove('session-checking');
  document.getElementById('session-loading').style.display = 'none';
}
}

// Jalankan saat aplikasi dibuka
restorePersadaSession();
