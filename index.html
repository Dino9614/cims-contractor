<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CIMS Contractor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      background: #12345a;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin-bottom: 0;
      color: #dbeafe;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    nav {
      width: 230px;
      background: #172b4d;
      padding: 20px 12px;
      flex-shrink: 0;
    }

    nav button {
      display: block;
      width: 100%;
      padding: 13px;
      margin-bottom: 6px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: white;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }

    nav button:hover,
    nav button.active {
      background: #2563eb;
    }

    main {
      flex: 1;
      min-width: 0;
      padding: 24px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0000000d;
    }

    .card p {
      color: #64748b;
      font-size: 13px;
    }

    .card h2 {
      font-size: 23px;
      margin-bottom: 0;
    }

    .panel {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 500px;
    }

    th, td {
      padding: 13px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
    }

    th {
      background: #f8fafc;
    }

    .badge {
      background: #fef3c7;
      color: #92400e;
      padding: 5px 9px;
      border-radius: 15px;
      font-size: 12px;
    }

    #content {
      min-height: 200px;
    }

    .notice {
      background: #dbeafe;
      padding: 14px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .container {
        display: block;
      }

      nav {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 5px;
      }

      nav button {
        margin: 0;
        font-size: 12px;
      }

      main {
        padding: 14px;
      }

      .cards {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .card {
        padding: 13px;
      }

      .card h2 {
        font-size: 18px;
      }
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://savwfujstejgygbkngxr.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Ctpwsis9YW9pn0CudzoLyA_eXxlJIIn";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
</script>
<style>
  body:not(.authenticated) > *:not(#login-screen) {
    display: none !important;
  }

  body.authenticated #login-screen {
    display: none !important;
  }

  body:not(.authenticated) #login-screen {
    display: flex !important;
  }
</style></head>

<body>
<div id="login-screen" style="display:none;min-height:100vh;align-items:center;justify-content:center;background:#f1f5f9;font-family:Arial,sans-serif;padding:20px;box-sizing:border-box">
  <form id="login-form" style="background:white;padding:30px;border-radius:14px;box-shadow:0 8px 30px #0001;width:100%;max-width:380px;box-sizing:border-box">
    <h2 style="color:#123b63;margin-top:0">CIMS CONTRACTOR</h2>
    <p style="color:#64748b">Silakan masuk ke akun Anda</p>
    <label for="login-email">Email</label>
    <input id="login-email" type="email" autocomplete="username" required style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 16px;border:1px solid #cbd5e1;border-radius:7px">
    <label for="login-password">Kata sandi</label>
    <input id="login-password" type="password" autocomplete="current-password" required style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 16px;border:1px solid #cbd5e1;border-radius:7px">
    <button id="login-button" type="submit" style="width:100%;padding:12px;background:#123b63;color:white;border:0;border-radius:7px;font-weight:bold">Masuk</button>
    <p id="login-message" role="status" style="color:#b91c1c;margin-bottom:0"></p>
  </form>
</div>
<header>
  <h1>CIMS CONTRACTOR</h1>
  <p>Contractor Integrated Management System</p>
</header>

<div class="container">

  <nav>
    <button class="active" onclick="showPage('Dashboard', this)">
      🏠 Dashboard
    </button>

    <button onclick="showPage('Master Data', this)">
      📁 Master Data
    </button>

    <button onclick="showPage('Proyek', this)">
      🏗️ Data Proyek
    </button>

    <button onclick="showPage('RAB', this)">
      📋 RAB
    </button>

    <button onclick="showPage('Penawaran', this)">
      📄 Penawaran
    </button>

    <button onclick="showPage('Purchase Order', this)">
      🛒 Purchase Order
    </button>

    <button onclick="showPage('Delivery Order', this)">
      🚚 Delivery Order
    </button>

    <button onclick="showPage('Akuntansi', this)">
      💰 Akuntansi
    </button>

    <button onclick="showPage('Approval', this)">
      ✅ Approval
    </button>

    <button onclick="showPage('Laporan Proyek', this)">
      📊 Laporan Proyek
    </button>

    <button onclick="showPage('Pengguna', this)">
      👥 Pengguna
    </button>
  </nav>

  <main>
    <div id="content"></div>
  </main>

</div>

<script>
  async function showPage(page, button) {
    document.querySelectorAll("nav button").forEach(function(item) {
      item.classList.remove("active");
    });

    if (button) {
      button.classList.add("active");
    }

    const content = document.getElementById("content");

    if (page === "Dashboard") {
      content.innerHTML = `
        <h2>Dashboard</h2>
        <p>Ringkasan kegiatan perusahaan kontraktor.</p>

        <div class="cards">
          <div class="card">
            <p>Proyek Aktif</p>
            <h2>0</h2>
          </div>

          <div class="card">
            <p>Total Penawaran</p>
            <h2>Rp 0</h2>
          </div>

          <div class="card">
            <p>Total Purchase Order</p>
            <h2>Rp 0</h2>
          </div>

          <div class="card">
            <p>Menunggu Approval</p>
            <h2>0</h2>
          </div>
        </div>

        <div class="panel">
          <h3>Daftar Proyek</h3>

          <table>
            <thead>
              <tr>
                <th>Nama Proyek</th>
                <th>Nilai Kontrak</th>
                <th>Status</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td colspan="3">
                  Belum ada data proyek.
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="notice">
          Mode prototipe. Data belum terhubung ke database.
        </div>
      `;
    } else if (page === "Pengguna") {
  content.innerHTML = `
    <h2>Manajemen Pengguna</h2>

    <div class="panel">
      <h3>Tambah Pengguna Baru</h3>

      <form id="add-user-form">
        <p>Nama Lengkap</p>
        <input id="new-user-name" type="text"
          placeholder="Nama lengkap" required>

        <p>Email</p>
        <input id="new-user-email" type="email"
          placeholder="Email pengguna" required>

        <p>Password</p>
        <input id="new-user-password" type="password"
          placeholder="Minimal 8 karakter" minlength="8" required>

       
<select id="userRole" required>
  <option value="director">Direktur</option>
  <option value="project_manager">Project Manager</option>
  <option value="estimator">Estimator</option>
  <option value="purchasing">Purchasing</option>
  <option value="warehouse">Warehouse</option>
  <option value="finance">Finance</option>
  <option value="accounting">Accounting</option>
  <option value="viewer">Viewer</option>
</select>


        <br><br>
        <button type="submit" id="save-user-button">
          + Simpan Pengguna
        </button>

        <p id="add-user-message"></p>
      </form>
    </div>

    <div class="panel">
      <h3>Daftar Pengguna</h3>
      <p id="user-loading">Memuat data pengguna...</p>
      <div id="user-table"></div>
    </div>
  `;

  const form = document.getElementById("add-user-form");
  const message = document.getElementById("add-user-message");
  const saveButton = document.getElementById("save-user-button");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    saveButton.disabled = true;
    saveButton.textContent = "Menyimpan...";
    message.textContent = "";

    try {
      const { data, error } = await supabaseClient.functions.invoke(
        "create-user",
        {
          body: {
            name: document.getElementById("new-user-name").value.trim(),
            email: document.getElementById("new-user-email").value.trim(),
            password: document.getElementById("new-user-password").value,            
            role: document.getElementById("userRole").value

          }
        }
      );

      if (error) throw error;
      if (!data || !data.success) {
        throw new Error(data?.error || "Gagal membuat pengguna");
      }

      message.textContent = "Pengguna berhasil dibuat!";
      message.style.color = "green";
      form.reset();

      await loadUsers();

    } catch (error) {
      message.textContent = "Gagal: " + error.message;
      message.style.color = "red";
    } finally {
      saveButton.disabled = false;
      saveButton.textContent = "+ Simpan Pengguna";
    }
  });

  async function loadUsers() {
    const table = document.getElementById("user-table");
    const loading = document.getElementById("user-loading");

    loading.textContent = "Memuat data pengguna...";

    const { data, error } = await supabaseClient
      .from("profiles")
      .select("id, full_name, role, is_active, created_at")
      .order("created_at", { ascending: false });

    if (error) {
      loading.textContent = "Gagal memuat: " + error.message;
      return;
    }

    loading.textContent = "";

    const safe = (value) => String(value ?? "").replace(
      /[&<>"']/g,
      char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]
    );

    if (!data || data.length === 0) {
      table.textContent = "Belum ada pengguna.";
      return;
    }

    table.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Nama</th>
            <th>Role</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          ${data.map(user => `
            <tr>
              <td>${safe(user.full_name)}</td>
              <td>${safe(user.role)}</td>
              <td>${user.is_active ? "Aktif" : "Nonaktif"}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }

  await loadUsers();
} else {
  content.innerHTML = `
    <h2>${page}</h2>
    <div class="panel">
      <h3>Modul ${page}</h3>
      <p>
        Modul ini belum diaktifkan.
        Kita akan membangunnya secara bertahap.
      </p>
      <span class="badge">Dalam pengembangan</span>
    </div>
  `;
}
  }

  showPage("Dashboard");
</script>
<script>
const loginForm = document.getElementById('login-form');

if (loginForm) {
  loginForm.addEventListener('submit', async function (event) {
    event.preventDefault();

    const button = document.getElementById('login-button');
    const message = document.getElementById('login-message');
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    button.disabled = true;
    button.textContent = 'Memeriksa...';
    message.textContent = '';

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      const { data: profile, error: profileError } =
        await supabaseClient
          .from('profiles')
          .select('full_name, role, is_active')
          .eq('id', data.user.id)
          .single();

      if (profileError) throw profileError;

      if (!profile.is_active) {
        await supabaseClient.auth.signOut();
        throw new Error('Akun Anda tidak aktif. Hubungi administrator.');
      }

      document.getElementById('login-screen').style.display = 'none';
      document.body.classList.add('authenticated');

      const header = document.querySelector('header');
      if (header) {
        const welcome = document.createElement('p');
        welcome.id = 'login-welcome';
        welcome.textContent =
          'Login: ' + profile.full_name + ' (' + profile.role + ')';
        header.appendChild(welcome);
      }

      message.textContent = '';
      alert('Login berhasil. Selamat datang, ' + profile.full_name + '!');
    } catch (error) {
      message.textContent = error.message || 'Login gagal.';
    } finally {
      button.disabled = false;
      button.textContent = 'Masuk';
    }
  });
}
</script>
</body>
</html>
